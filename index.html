<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A Little Something For You 💗</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:Georgia,serif;
}

.card{
  width:min(94vw,700px);
  height:min(88vh,760px);
  border-radius:28px;
  background:linear-gradient(145deg,#fff8f4,#fbe9e4);
  position:relative;
  overflow:hidden;
  box-shadow:0 0 60px rgba(255,120,160,.28);
  text-align:center;
}

.small-text{
  margin-top:48px;
  color:#8d6870;
  font-size:18px;
  font-style:italic;
  letter-spacing:1px;
}

.title{
  margin-top:20px;
  color:#6d3c49;
  font-size:34px;
  opacity:0;
  transform:translateY(15px);
  transition:1s;
}

.title.show{
  opacity:1;
  transform:translateY(0);
}

.heart-area{
  height:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.glow{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,125,170,.30);
  filter:blur(30px);
  animation:pulse 1.8s infinite;
}

.heart{
  width:125px;
  height:125px;
  background:#ff5c96;
  transform:rotate(-45deg);
  position:relative;
  box-shadow:0 12px 35px rgba(255,60,130,.45);
  animation:heartBeat 1.5s infinite;
  cursor:pointer;
  z-index:2;
}

.heart:before,
.heart:after{
  content:"";
  position:absolute;
  width:125px;
  height:125px;
  border-radius:50%;
  background:#ff5c96;
}

.heart:before{
  top:-62px;
  left:0;
}

.heart:after{
  top:0;
  left:62px;
}

@keyframes heartBeat{
  0%,100%{transform:rotate(-45deg) scale(1)}
  50%{transform:rotate(-45deg) scale(1.08)}
}

@keyframes pulse{
  0%,100%{transform:scale(.8);opacity:.5}
  50%{transform:scale(1.15);opacity:.8}
}

.pull{
  position:absolute;
  bottom:35px;
  color:#94747c;
  font-size:14px;
  letter-spacing:4px;
}

.rope{
  position:absolute;
  width:3px;
  height:105px;
  background:#555;
  bottom:-8px;
  left:50%;
  transform:translateX(-50%);
  cursor:grab;
  z-index:5;
}

.handle{
  position:absolute;
  width:22px;
  height:35px;
  border:3px solid #555;
  border-radius:50%;
  left:50%;
  bottom:-40px;
  transform:translateX(-50%);
  background:#fbe9e4;
}

.message{
  position:absolute;
  inset:0;
  background:rgba(255,247,244,.96);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transform:scale(.9);
  transition:1s;
  z-index:10;
}

.message.show{
  opacity:1;
  pointer-events:auto;
  transform:scale(1);
}

.message h1{
  font-size:52px;
  color:#e8477d;
  margin-bottom:18px;
}

.message p{
  color:#704651;
  font-size:22px;
  max-width:80%;
  line-height:1.6;
}

.btn{
  margin-top:30px;
  padding:13px 28px;
  border:0;
  border-radius:30px;
  background:#ff5c96;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(255,70,130,.3);
}

.confetti{
  position:absolute;
  width:9px;
  height:14px;
  top:-20px;
  animation:fall 3s linear forwards;
  z-index:20;
}

@keyframes fall{
  to{
    transform:translateY(850px) rotate(720deg);
    opacity:0;
  }
}

@media(max-width:500px){
  .card{
    width:94vw;
    height:88vh;
  }

  .small-text{
    margin-top:35px;
    font-size:15px;
  }

  .title{
    font-size:27px;
  }

  .heart-area{
    height:360px;
  }

  .heart{
    width:100px;
    height:100px;
  }

  .heart:before,
  .heart:after{
    width:100px;
    height:100px;
  }

  .heart:before{
    top:-50px;
  }

  .heart:after{
    left:50px;
  }

  .message h1{
    font-size:40px;
  }

  .message p{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="small-text">a little something, for you</div>

  <h2 class="title" id="title">
    Pull the little heart 💗
  </h2>

  <div class="heart-area">

    <div class="glow"></div>

    <div class="heart" id="heart"></div>

    <div class="rope" id="rope">
      <div class="handle"></div>
    </div>

    <div class="pull">PULL & RELEASE</div>

  </div>

  <div class="message" id="message">

    <h1>Happy Birthday! 🎂💗</h1>

    <p>
      You are someone really special.
      May your day be filled with happiness,
      beautiful memories and lots of love. ✨
    </p>

    <button class="btn" onclick="closeMessage()">
      ❤️ Thank You
    </button>

  </div>

</div>

<script>
const rope = document.getElementById("rope");
const message = document.getElementById("message");
const title = document.getElementById("title");

let startY = 0;
let pulling = false;

title.classList.add("show");

function reveal(){
  message.classList.add("show");
  createConfetti();
}

rope.addEventListener("touchstart",function(e){
  pulling=true;
  startY=e.touches[0].clientY;
});

rope.addEventListener("touchmove",function(e){

  if(!pulling) return;

  const currentY=e.touches[0].clientY;
  const distance=currentY-startY;

  if(distance>0){
    rope.style.transform=
      "translateX(-50%) translateY("+Math.min(distance,130)+"px)";
  }

  if(distance>90){
    pulling=false;
    rope.style.transform="translateX(-50%)";
    reveal();
  }
});

rope.addEventListener("touchend",function(){
  pulling=false;
  rope.style.transform="translateX(-50%)";
});

rope.addEventListener("mousedown",function(e){
  pulling=true;
  startY=e.clientY;
});

document.addEventListener("mousemove",function(e){

  if(!pulling) return;

  const distance=e.clientY-startY;

  if(distance>0){
    rope.style.transform=
      "translateX(-50%) translateY("+Math.min(distance,130)+"px)";
  }

  if(distance>90){
    pulling=false;
    rope.style.transform="translateX(-50%)";
    reveal();
  }
});

document.addEventListener("mouseup",function(){
  pulling=false;
  rope.style.transform="translateX(-50%)";
});

document.getElementById("heart").addEventListener("click",reveal);

function createConfetti(){

  for(let i=0;i<80;i++){

    const c=document.createElement("div");

    c.className="confetti";

    c.style.left=Math.random()*100+"%";
    c.style.background=
      ["#ff5c96","#ffcc70","#8fd3ff","#b995ff","#7ee0b5"]
      [Math.floor(Math.random()*5)];

    c.style.animationDelay=
      Math.random()*1.5+"s";

    document.querySelector(".card").appendChild(c);

    setTimeout(()=>{
      c.remove();
    },4500);
  }
}

function closeMessage(){
  message.classList.remove("show");
}
</script>

</body>
</html>
